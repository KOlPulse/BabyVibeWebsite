<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$BabyVibe Video Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="art-page">
  <video autoplay muted loop playsinline class="page-bg-video">
  <source src="art.mp4" type="video/mp4">
  Jouw browser ondersteunt geen video.
</video>

<!-- Bovenste knoppen container -->
<div class="top-buttons-container">
  <a href="index.html" class="back-button">← Back to Home</a>
  
  <button class="music-btn" onclick="toggleMusic()">
    🎵 Let's Vibe: <span id="musicState">▶ Play</span>
  </button>
  <audio id="vibeAudio" preload="auto"></audio>
</div>
  
  <!-- De doorlopende videobanner onderaan -->
  <div class="video-banner-container">
    <div class="video-banner-track">
      <!-- Set 1 -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      
      <div class="banner-item-wrapper">
        <iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1"></iframe>
        <!-- Autoplay=1 toegevoegd aan de onclick link zodat hij direct afspeelt met geluid bij openen -->
        <div class="click-overlay" onclick="openVideoModal('https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1')"></div>
      </div>
      
      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>
      
      <div class="banner-item-wrapper">
        <iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1"></iframe>
        <div class="click-overlay" onclick="openVideoModal('https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1')"></div>
      </div>

      <!-- Set 2 (Kopie voor naadloze loop) -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      
      <div class="banner-item-wrapper">
        <iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1"></iframe>
        <div class="click-overlay" onclick="openVideoModal('https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1')"></div>
      </div>

      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>

      <div class="banner-item-wrapper">
        <iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1"></iframe>
        <div class="click-overlay" onclick="openVideoModal('https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1')"></div>
      </div>
    </div>
  </div>

  <!-- De vernieuwde pop-up (modal) voor het vergroten -->
  <div id="videoModal" class="modal">
    <span class="close-modal">&times;</span>
    <!-- MP4 Video speler (standaard verborgen) -->
    <video id="modalVideo" controls style="display: none; max-width: 90%; max-height: 90%;"></video>
    <!-- YouTube speler (standaard verborgen) -->
    <iframe id="modalIframe" allow="autoplay; fullscreen" style="display: none; width: 80vw; height: 80vh; border: 4px solid #00e5ff; border-radius: 12px; box-shadow: 0 0 30px rgba(0, 229, 255, 0.5);"></iframe>
  </div>

  <script>
  const modal = document.getElementById('videoModal');
  const modalVideo = document.getElementById('modalVideo');
  const modalIframe = document.getElementById('modalIframe');
  const closeModal = document.querySelector('.close-modal');

  // Nieuwe functie: Speciaal voor YouTube iframes
  function openVideoModal(url) {
    modal.style.display = 'flex';
    modalVideo.style.display = 'none'; // Verberg MP4 speler
    modalVideo.pause(); // Stop MP4 geluid
    modalIframe.style.display = 'block'; // Toon YouTube speler
    modalIframe.src = url; // Laad de link in
  }

  // Bestaande functie: Speciaal voor MP4 video's
  const bannerVideos = document.querySelectorAll('video.banner-item');
  bannerVideos.forEach(video => {
    video.addEventListener('click', function() {
      modal.style.display = 'flex';
      modalIframe.style.display = 'none'; // Verberg YouTube speler
      modalIframe.src = ''; // Stop YouTube geluid
      modalVideo.style.display = 'block'; // Toon MP4 speler
      modalVideo.src = this.src;
      modalVideo.play();
    });
  });

  // Functie: Alles afsluiten en resetten
  const sluitVideo = () => {
    modal.style.display = 'none';
    modalVideo.pause();
    modalVideo.src = '';
    modalIframe.src = ''; // Zeer belangrijk: stopt het YouTube geluid als je de popup sluit
  };

  closeModal.addEventListener('click', sluitVideo);
  window.addEventListener('click', (event) => {
    if (event.target === modal) {
      sluitVideo();
    }
  });
  </script>

<script src="music.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$BabyVibe - Token Info</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="token-body">
    <video autoplay muted loop playsinline class="page-bg-video">
  <source src="info.mp4" type="video/mp4">
  Jouw browser ondersteunt geen video.
</video>

  <!-- Terugknop naar de homepage -->
  <a href="index.html" class="back-button">← Back to Homepage</a>

  <div class="token-wrapper">
    <!-- De Luxe Glazen Container met Neon Groene Rand -->
    <div class="token-box">
      
      <div class="token-header">
        <h2>$BabyVibe Token Stats</h2>
        <p>Live metrics & market telemetry straight from the Solana blockchain.</p>
      </div>

      <!-- Live Statistieken Raster -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Market Cap</span>
          <span id="market-cap" class="stat-value">Loading...</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Price (USD)</span>
          <span id="token-price" class="stat-value">Loading...</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">24h Volume</span>
          <span id="volume-24h" class="stat-value">Loading...</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Liquidity</span>
          <span id="liquidity" class="stat-value">Loading...</span>
        </div>
      </div>

      <!-- Contract Adres Blok -->
      <div class="ca-container">
        <span class="ca-title">Contract Address (CA):</span>
        <div class="ca-box">
          <input type="text" value="54g2GnhV2mcheYD7Rvdt6MWniLdUsXQKeVNz5KZhdoge" id="ca-input" readonly>
          <button onclick="copyCA()" id="copy-btn">Copy CA</button>
        </div>
      </div>

      <!-- Extra DexScreener Mini Embed voor visualisatie -->
      <div class="token-embed-container">
        <iframe src="https://dexscreener.com/solana/54g2GnhV2mcheYD7Rvdt6MWniLdUsXQKeVNz5KZhdoge?embed=1&theme=dark&trades=0&info=1" title="BabyVibe Stats"></iframe>
      </div>

    </div>
  </div>

  <!-- Script om live data op te halen van DexScreener -->
  <script>
    async function fetchTokenData() {
      try {
        const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/54g2GnhV2mcheYD7Rvdt6MWniLdUsXQKeVNz5KZhdoge');
        const data = await response.json();
        
        if (data.pairs && data.pairs.length > 0) {
          // Pak de eerste liquiditeitspair
          const pair = data.pairs[0];
          
          document.getElementById('token-price').innerText = '$' + Number(pair.priceUsd).toLocaleString(undefined, {minimumFractionDigits: 6, maximumFractionDigits: 8});
          document.getElementById('market-cap').innerText = '$' + Number(pair.fdv || pair.marketCap).toLocaleString();
          document.getElementById('volume-24h').innerText = '$' + Number(pair.volume.h24).toLocaleString();
          document.getElementById('liquidity').innerText = '$' + Number(pair.liquidity.usd).toLocaleString();
        }
      } catch (error) {
        console.error('Fout bij ophalen token data:', error);
      }
    }

    // Direct laden en elke 10 seconden verversen
    fetchTokenData();
    setInterval(fetchTokenData, 10000);

    // Functie voor de kopieer-knop
    function copyCA() {
      const copyText = document.getElementById("ca-input");
      copyText.select();
      copyText.setSelectionRange(0, 99999);
      navigator.clipboard.writeText(copyText.value);
      
      const btn = document.getElementById("copy-btn");
      btn.innerText = "Copied!";
      setTimeout(() => { btn.innerText = "Copy CA"; }, 2000);
    }
  </script>

</body>
</html>

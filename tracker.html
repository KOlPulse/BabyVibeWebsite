<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyVibe Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body class="buy-body">

    <!-- Terug naar Home en Muziek -->
    <div class="top-buttons-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        <button class="music-btn" onclick="toggleMusic()">🎵 Let's Vibe: <span id="musicState">▶ Play</span></button>
        <audio id="vibeAudio" preload="auto"></audio>
    </div>

    <!-- Tracker Container -->
    <div class="tracker-wrapper">
        <div class="tracker-box">
            <img src="logo.png" alt="BabyVibe Logo" class="tracker-logo">
            
            <h2>My $BabyVibe Bag</h2>
            <div class="live-price-box">
                <p>Live Price: <strong id="livePrice" class="neon-text">Loading...</strong></p>
            </div>

            <div class="input-section" style="margin-top: 20px;">
                <label for="tokenAmount" style="color: #aaa; margin-bottom: 8px; display: block;">Enter Your Token Amount:</label>
                <input type="number" id="tokenAmount" placeholder="e.g. 15000000" style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #00ff88; background: rgba(0,0,0,0.6); color: #fff; font-size: 16px; margin-bottom: 15px;">
                
                <!-- De nieuwe Calculate Knop -->
                <button onclick="calculateTotal()" class="vibe-button" style="width: 100%; margin: 0; padding: 12px; font-size: 16px; border-radius: 10px;">📊 Calculate Value</button>
            </div>

            <div class="total-value-box" style="background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; padding: 15px; margin-top: 20px;">
                <h3 style="margin: 0 0 10px 0;">Total Value:</h3>
                <h1 id="totalValue" class="neon-text" style="margin: 0;">$0.00</h1>
            </div>

            <button id="installAppBtn" class="vibe-button" style="display: none; width: 100%; margin-top: 25px; padding: 10px;">📲 Install as App</button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const tokenInput = document.getElementById('tokenAmount');
        const priceDisplay = document.getElementById('livePrice');
        const valueDisplay = document.getElementById('totalValue');
        let currentPrice = 0;

        // Service Worker voor de App
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW niet geladen:", err));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block';
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            const savedTokens = localStorage.getItem('babyVibeTokens');
            if (savedTokens) {
                tokenInput.value = savedTokens;
            }
            fetchLivePrice();
            setInterval(fetchLivePrice, 10000);
        });

        async function fetchLivePrice() {
            try {
                const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/An9dC5p9ZqCg9LB4cKCBtLvoJCShpXrWw53xGZwyvroK');
                const data = await response.json();
                
                if (data.pairs && data.pairs.length > 0) {
                    currentPrice = parseFloat(data.pairs[0].priceUsd);
                    priceDisplay.innerText = "$" + currentPrice.toFixed(6);
                    
                    // Bereken direct als er al een opgeslagen bedrag staat bij het openen
                    if (tokenInput.value) {
                        calculateTotal();
                    }
                } else {
                    priceDisplay.innerText = "No pairs found";
                }
            } catch (error) {
                priceDisplay.innerText = "Error loading data";
            }
        }

        // Wordt nu alleen geactiveerd via de nieuwe knop (en bij het laden)
        function calculateTotal() {
            const amount = parseFloat(tokenInput.value) || 0;
            localStorage.setItem('babyVibeTokens', amount); 
            const total = amount * currentPrice;
            valueDisplay.innerText = "$" + total.toFixed(2);
        }
    </script>
</body>
</html>

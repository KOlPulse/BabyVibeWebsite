<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$BabyVibe Video Room</title>
  <!-- Hier zit de belangrijke link naar je styling! -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="art-page">
  <video autoplay muted loop playsinline class="page-bg-video">
  <source src="art.mp4" type="video/mp4">
  Jouw browser ondersteunt geen video.
</video>
  <!-- Terugknop naar de hoofdpagina -->
  <a href="index.html" class="back-button">← Back to Home</a>

  <!-- De doorlopende videobanner onderaan -->
  <div class="video-banner-container">
    <div class="video-banner-track">
      <!-- Set 1 -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      <div class="banner-item-wrapper"><iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1"></iframe></div>
      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>
      <div class="banner-item-wrapper"><iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1"></iframe></div>

      <!-- Set 2 (Kopie voor naadloze loop) -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      <div class="banner-item-wrapper"><iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1"></iframe></div>
      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>
      <div class="banner-item-wrapper"><iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1"></iframe></div>
    </div>
  </div> 

  <!-- De onzichtbare pop-up (modal) voor het vergroten -->
  <div id="videoModal" class="modal">
    <span class="close-modal">&times;</span>
    <video id="modalVideo" controls></video>
  </div>

  <script>
  // Filtert nu specifiek op video.banner-item zodat YouTube iframes niet crashen bij aanklikken
  const bannerVideos = document.querySelectorAll('video.banner-item');
  const modal = document.getElementById('videoModal');
  const modalVideo = document.getElementById('modalVideo');
  const closeModal = document.querySelector('.close-modal');

  bannerVideos.forEach(video => {
    video.addEventListener('click', function() {
      modal.style.display = 'flex';
      modalVideo.src = this.src;
      modalVideo.play();
    });
  });

  const sluitVideo = () => {
    modal.style.display = 'none';
    modalVideo.pause();
    modalVideo.src = '';
  };

  closeModal.addEventListener('click', sluitVideo);
  window.addEventListener('click', (event) => {
    if (event.target === modal) {
      sluitVideo();
    }
  });
  </script>
</body>
</html>

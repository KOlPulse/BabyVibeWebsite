<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$BabyVibe - Buy Room</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="buy-body">

  <!-- Achtergrondvideo -->
  <video autoplay muted loop playsinline class="page-bg-video">
    <source src="buyroom.mp4" type="video/mp4">
    Jouw browser ondersteunt geen video.
  </video>

  <!-- Terugknop naar de homepage -->
  <a href="index.html" class="back-button">← Back to Homepage</a>

  <!-- De hoofdcontainer die alles rechts uitlijnt -->
  <div class="buy-wrapper">
    
    <!-- De glazen box -->
    <div class="buy-box">
      
      <!-- De header boven de Jupiter terminal -->
      <div class="buy-header">
        <h2>Buy $VIBECOIN</h2>
        <p>Swap SOL for $VIBECOIN instantly</p>
        
        <!-- Hier staat je How to Buy knop perfect in het midden van de box -->
        <button id="howToBuyBtn" class="vibe-button how-to-buy-btn">How to Buy ❓</button>
      </div>

      <!-- Hieronder begint je id="jupiter-terminal" div... -->
      
      <!-- Hier laadt de Jupiter Swap Terminal in -->
      <div id="jupiter-terminal"></div>
    </div>
  </div>

<!-- 1. Eerst de instellingen laden -->
<script>
  function initJupiter() {
    if (window.Jupiter) {
      window.Jupiter.init({
        displayMode: "integrated",
        integratedTargetId: "jupiter-terminal",
        endpoint: "https://rpc.ankr.com/solana",
        strictTokenList: false,
        formProps: {
          initialOutputMint: "54g2GnhV2mcheYD7Rvdt6MWniLdUsXQKeVNz5KZhdoge",
          initialInputMint: "So11111111111111111111111111111111111111112",
        },
      });
    }
  }
</script>

<!-- 2. Daarna pas het externe script inladen en starten -->
<script src="https://terminal.jup.ag/main-v3.js" onload="initJupiter()"></script>
    

</body>
</html>

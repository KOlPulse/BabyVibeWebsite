<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyVibe Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        .neon-input {
            width: 100%;
            padding: 15px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff88;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
        }
        .neon-input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        .neon-btn {
            width: 100%;
            padding: 16px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        .neon-btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }
    </style>
</head>
<body class="buy-body">

    <div class="top-buttons-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        <button class="music-btn" onclick="toggleMusic()">🎵 Let's Vibe: <span id="musicState">▶ Play</span></button>
        <audio id="vibeAudio" preload="auto"></audio>
    </div>

    <div class="tracker-wrapper">
        <div class="tracker-box">
            <img src="logo.png" alt="BabyVibe Logo" class="tracker-logo">
            
            <h2 style="margin-bottom: 20px;">My $BabyVibe Bag</h2>
            
            <!-- Live Data Box (Price & Market Cap) -->
            <div style="display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 15px; border-radius: 12px; border: 1px solid rgba(0, 255, 136, 0.3); margin-bottom: 25px;">
                <div style="text-align: center; width: 50%; border-right: 1px solid rgba(0, 255, 136, 0.3);">
                    <span style="color: #aaa; font-size: 12px; display: block; margin-bottom: 5px;">Live Price</span>
                    <strong id="livePrice" class="neon-text" style="font-size: 15px;">Loading...</strong>
                </div>
                <div style="text-align: center; width: 50%;">
                    <span style="color: #aaa; font-size: 12px; display: block; margin-bottom: 5px;">Market Cap</span>
                    <strong id="marketCap" class="neon-text" style="font-size: 15px;">Loading...</strong>
                </div>
            </div>

            <div class="input-section">
                <label for="tokenAmount" style="color: #aaa; margin-bottom: 10px; display: block; font-size: 14px;">Enter Your Token Amount:</label>
                <input type="number" id="tokenAmount" class="neon-input" placeholder="0" oninput="calculateTotal()">
                
                <!-- De Calculate Knop in Neon Stijl -->
                <button onclick="calculateTotal()" class="neon-btn" style="margin-bottom: 10px;">📊 Calculate Value</button>
            </div>

            <div class="total-value-box" style="background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; padding: 20px; margin-top: 15px;">
                <h3 style="margin: 0 0 10px 0; color: #ddd; font-size: 16px;">Total Value:</h3>
                <h1 id="totalValue" class="neon-text" style="margin: 0; font-size: 32px;">$0.00</h1>
            </div>

            <!-- Installatie Knop -->
            <button id="installAppBtn" class="neon-btn" style="margin-top: 30px;">
                <span style="font-size: 20px;">📲</span> Install as App
            </button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const tokenInput = document.getElementById('tokenAmount');
        const priceDisplay = document.getElementById('livePrice');
        const marketCapDisplay = document.getElementById('marketCap');
        const valueDisplay = document.getElementById('totalValue');
        let currentPrice = 0;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log("SW error:", err));
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("Klik op de 3 puntjes (of deel-knop) in je browser menu en kies 'Toevoegen aan startscherm' om de app te installeren!");
            }
        });

        function formatNumber(num) {
            if (num >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '$' + (num / 1000).toFixed(2) + 'K';
            return '$' + num.toFixed(0);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTokens = localStorage.getItem('babyVibeTokens');
            if (savedTokens) {
                tokenInput.value = savedTokens;
            }
            fetchLivePrice();
            setInterval(fetchLivePrice, 5000); // Checkt nu elke 5 seconden voor snellere updates
        });

        async function fetchLivePrice() {
            try {
                // Voeg een cache-buster toe zodat de browser altijd de allernieuwste data pakt
                const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/An9dC5p9ZqCg9LB4cKCBtLvoJCShpXrWw53xGZwyvroK?timestamp=' + new Date().getTime());
                const data = await response.json();
                
                if (data && data.pairs && data.pairs.length > 0) {
                    const pair = data.pairs[0];
                    currentPrice = parseFloat(pair.priceUsd);
                    priceDisplay.innerText = "$" + currentPrice.toFixed(6);
                    
                    const mc = pair.marketCap || pair.fdv || 0;
                    marketCapDisplay.innerText = mc > 0 ? formatNumber(mc) : "?";
                } else {
                    priceDisplay.innerText = "No pairs found";
                    marketCapDisplay.innerText = "-";
                }
                calculateTotal();
            } catch (error) {
                priceDisplay.innerText = "Retrying...";
            }
        }

        function calculateTotal() {
            const amount = parseFloat(tokenInput.value) || 0;
            localStorage.setItem('babyVibeTokens', amount); 
            const total = amount * currentPrice;
            valueDisplay.innerText = "$" + total.toFixed(2);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyVibe Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Deze regel koppelt de downloadbare app instellingen (zie stap 3) -->
    <link rel="manifest" href="manifest.json">
</head>
<body class="buy-body">

    <!-- Terug naar Home en Muziek -->
    <div class="top-buttons-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        <button class="music-btn" onclick="toggleMusic()">🎵 Let's Vibe: <span id="musicState">▶ Play</span></button>
        <audio id="vibeAudio" preload="auto"></audio>
    </div>

   <!-- Tracker Container -->
    <div class="tracker-wrapper">
        <div class="tracker-box">
            <img src="logo.png" alt="BabyVibe Logo" class="tracker-logo">
            
            <h2>My $BabyVibe Bag</h2>
            <div class="live-price-box">
                <p>Live Price: <strong id="livePrice" class="neon-text">Loading...</strong></p>
            </div>

            <div class="input-section">
                <label for="tokenAmount">Your Token Amount:</label>
                <input type="number" id="tokenAmount" placeholder="e.g. 1000000" oninput="calculateTotal()">
            </div>

            <div class="total-value-box">
                <h3>Total Value:</h3>
                <h1 id="totalValue" class="neon-text">$0.00</h1>
            </div>

            <!-- De Installatie Knop (standaard verborgen tot de telefoon hem goedkeurt) -->
            <button id="installAppBtn" class="vibe-button" style="display: none; width: 100%; margin-top: 25px; padding: 10px;">📲 Install as App</button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const tokenInput = document.getElementById('tokenAmount');
        const priceDisplay = document.getElementById('livePrice');
        const valueDisplay = document.getElementById('totalValue');
        let currentPrice = 0;

        // 1. Koppel de Service Worker voor App Installatie
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log("Service Worker Actief!");
            });
        }

        // 2. Beheer de 'Install App' knop
        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.style.display = 'block'; // Laat de knop zien op Android!
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    installBtn.style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // 3. Koers Ophalen en Berekenen
        window.addEventListener('DOMContentLoaded', () => {
            const savedTokens = localStorage.getItem('babyVibeTokens');
            if (savedTokens) {
                tokenInput.value = savedTokens;
            }
            fetchLivePrice();
            setInterval(fetchLivePrice, 10000);
        });

        async function fetchLivePrice() {
            try {
                const response = await fetch('https://api.dexscreener.com/latest/dex/tokens/An9dC5p9ZqCg9LB4cKCBtLvoJCShpXrWw53xGZwyvroK');
                const data = await response.json();
                
                if (data.pairs && data.pairs.length > 0) {
                    currentPrice = parseFloat(data.pairs[0].priceUsd);
                    priceDisplay.innerText = "$" + currentPrice.toFixed(6);
                    calculateTotal();
                } else {
                    priceDisplay.innerText = "No pairs found";
                }
            } catch (error) {
                priceDisplay.innerText = "Error loading data";
                console.log("Fetch error:", error);
            }
        }

        function calculateTotal() {
            const amount = parseFloat(tokenInput.value) || 0;
            localStorage.setItem('babyVibeTokens', amount); 
            const total = amount * currentPrice;
            valueDisplay.innerText = "$" + total.toFixed(2);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BabyVibe Portfolio Tracker</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="buy-body">

  <video autoplay muted loop playsinline class="page-bg-video">
    <source src="tracker.mp4?v=2" type="video/mp4">
    Jouw browser ondersteunt geen video.
  </video>

  <div class="top-buttons-container">
    <a href="index.html" class="back-button">← Back to Home</a>
    <button class="music-btn" onclick="toggleMusic()">🎵 Let's Vibe: <span id="musicState">▶ Play</span></button>
    <audio id="vibeAudio" preload="auto"></audio>
  </div>

  <div class="buy-wrapper">
    <div class="buy-box" style="padding: 25px; text-align: center;">
      
      <div style="text-align: center; margin-bottom: 15px;">
        <img src="logo.png" alt="BabyVibe Logo" style="width: 70px; border-radius: 50%; box-shadow: 0 0 15px #00ff88; border: 2px solid #00ff88; margin-bottom: 10px;">
        <h2 style="margin: 0; color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.6); font-size: 24px;">My $BabyVibe Bag</h2>
      </div>
      
      <div style="display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; border: 1px solid rgba(0, 255, 136, 0.3); margin-bottom: 20px;">
          <div style="text-align: center; width: 50%; border-right: 1px solid rgba(0, 255, 136, 0.3);">
              <span style="color: #aaa; font-size: 11px; display: block; margin-bottom: 3px;">Live Price</span>
              <strong id="livePrice" style="color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.4); font-size: 13px;">Loading...</strong>
          </div>
          <div style="text-align: center; width: 50%;">
              <span style="color: #aaa; font-size: 11px; display: block; margin-bottom: 3px;">Market Cap</span>
              <strong id="marketCap" style="color: #00ff88; text-shadow: 0 0 8px rgba(0, 255, 136, 0.4); font-size: 13px;">Loading...</strong>
          </div>
      </div>

      <div style="margin: 0 0 15px 0; text-align: left;">
          <label for="tokenAmount" style="color: #aaa; margin-bottom: 5px; display: block; font-size: 12px;">Enter Your Token Amount:</label>
          <input type="number" id="tokenAmount" placeholder="0" oninput="calculateTotal()" style="width: 100%; padding: 12px; background: rgba(0, 0, 0, 0.8); border: 2px solid #00ff88; border-radius: 12px; color: #fff; font-size: 16px; outline: none; box-sizing: border-box; text-align: center; font-weight: bold;">
          
          <button onclick="calculateTotal()" class="vibe-button" style="width: 100%; margin-top: 10px; padding: 12px; font-size: 14px; cursor: pointer;">CALCULATE VALUE</button>
      </div>

      <div style="background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; padding: 12px; margin-top: 15px;">
          <h3 style="margin: 0 0 5px 0; color: #ddd; font-size: 13px;">Total Value:</h3>
          <h1 id="totalValue" style="margin: 0; color: #00ff88; text-shadow: 0 0 10px rgba(0, 255, 136, 0.6); font-size: 26px;">$0.00</h1>
      </div>

      <button id="installAppBtn" class="vibe-button" style="width: 100%; margin-top: 15px; padding: 12px; font-size: 14px; cursor: pointer; display: flex; justify-content: center; align-items: center;">
          INSTALL AS APP
      </button>

    </div>
  </div>

  <!-- De nieuwe custom Installatie Pop-up Modal -->
  <div id="installModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 1000; justify-content: center; align-items: center;">
    <div style="background: rgba(10, 10, 15, 0.95); backdrop-filter: blur(15px); border: 2px solid #00ff88; border-radius: 20px; padding: 40px 20px; max-width: 350px; width: 90%; color: #fff; box-shadow: 0 0 30px rgba(0, 255, 136, 0.4); position: relative; text-align: center;">
      <span id="closeInstallModal" style="position: absolute; top: 10px; right: 20px; color: #00ff88; font-size: 35px; font-weight: bold; cursor: pointer;">&times;</span>
      <h2 style="color: #00ff88; font-size: 20px; margin-bottom: 15px; margin-top: 5px;">Install BabyVibe</h2>
      <p style="font-size: 14px; color: #ddd; margin-bottom: 20px; line-height: 1.5;">Je browser blokkeert automatische installatie. Installeer handmatig:</p>
      <p style="font-size: 15px; font-weight: bold; margin-bottom: 10px;">1. Tap op het Deel icoon onderin je scherm</p>
      <p style="font-size: 15px; font-weight: bold;">2. Kies: <span style="background: rgba(0,255,136,0.1); padding: 5px 8px; border: 1px solid #00ff88; border-radius: 8px; display: inline-block; margin-top: 8px;">Zet op beginscherm 📱</span></p>
    </div>
  </div>

  <script src="music.js"></script>
  <script>
      const tokenInput = document.getElementById('tokenAmount');
      const priceDisplay = document.getElementById('livePrice');
      const marketCapDisplay = document.getElementById('marketCap');
      const valueDisplay = document.getElementById('totalValue');
      
      const installModal = document.getElementById('installModal');
      const closeInstallModal = document.getElementById('closeInstallModal');
      
      let currentPrice = 0;

      if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js');
      }

      let deferredPrompt;
      const installBtn = document.getElementById('installAppBtn');

      window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          deferredPrompt = e;
      });

      installBtn.addEventListener('click', async () => {
          if (deferredPrompt) {
              deferredPrompt.prompt();
              const { outcome } = await deferredPrompt.userChoice;
              deferredPrompt = null;
          } else {
              /* Laat de custom modal zien in plaats van de lelijke alert */
              installModal.style.display = 'flex';
          }
      });

      /* Sluit-logica voor de pop-up */
      closeInstallModal.onclick = function() {
          installModal.style.display = 'none';
      }
      window.onclick = function(event) {
          if (event.target == installModal) {
              installModal.style.display = 'none';
          }
      }

      function formatNumber(num) {
          if (num >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
          if (num >= 1000) return '$' + (num / 1000).toFixed(2) + 'K';
          return '$' + num.toFixed(0);
      }

      window.addEventListener('DOMContentLoaded', () => {
          const savedTokens = localStorage.getItem('babyVibeTokens');
          if (savedTokens) {
              tokenInput.value = savedTokens;
          }
          fetchLivePrice();
          setInterval(fetchLivePrice, 5000);
      });

      async function fetchLivePrice() {
          try {
              const response = await fetch('https://api.dexscreener.com/latest/dex/search?q=An9dC5p9ZqCg9LB4cKCBtLvoJCShpXrWw53xGZwyvroK');
              const data = await response.json();
              
              if (data && data.pairs && data.pairs.length > 0) {
                  const pair = data.pairs[0];
                  currentPrice = parseFloat(pair.priceUsd);
                  priceDisplay.innerText = "$" + currentPrice.toFixed(6);
                  
                  const mc = pair.marketCap || pair.fdv || 0;
                  marketCapDisplay.innerText = mc > 0 ? formatNumber(mc) : "?";
              } else {
                  priceDisplay.innerText = "No pairs found";
                  marketCapDisplay.innerText = "-";
              }
              calculateTotal();
          } catch (error) {
              priceDisplay.innerText = "Retrying...";
          }
      }

      function calculateTotal() {
          const amount = parseFloat(tokenInput.value) || 0;
          localStorage.setItem('babyVibeTokens', amount); 
          const total = amount * currentPrice;
          valueDisplay.innerText = "$" + total.toFixed(2);
      }
  </script>
</body>
</html>

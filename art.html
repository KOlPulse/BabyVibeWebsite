<body class="art-page">
  <!-- Terugknop naar de hoofdpagina -->

  <!-- De doorlopende videobanner onderaan -->
  <div class="video-banner-container">
    <div class="video-banner-track">
      <!-- Set 1 -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      <iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1&playlist=K6gfijDJLS4" frameborder="0" allow="autoplay"></iframe>
      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>
      <iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1&playlist=IwgW2Z4GLCY" frameborder="0" allow="autoplay"></iframe>

      <!-- Set 2 (Kopie voor naadloze loop) -->
      <video class="banner-item" src="vid1.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid2.mp4" muted loop autoplay playsinline></video>
      <video class="banner-item" src="vid3.mp4" muted loop autoplay playsinline></video>
      <iframe class="banner-item" src="https://www.youtube.com/embed/K6gfijDJLS4?autoplay=1&mute=1&loop=1&playlist=K6gfijDJLS4" frameborder="0" allow="autoplay"></iframe>
      <video class="banner-item" src="vid5.mp4" muted loop autoplay playsinline></video>
      <iframe class="banner-item" src="https://www.youtube.com/embed/IwgW2Z4GLCY?autoplay=1&mute=1&loop=1&playlist=IwgW2Z4GLCY" frameborder="0" allow="autoplay"></iframe>
    </div>
  </div> 

    <!-- De onzichtbare pop-up (modal) voor het vergroten -->
    <div id="videoModal" class="modal">
      <span class="close-modal">&times;</span>
      <video id="modalVideo" controls></video>
    </div>

    <script>
    const bannerVideos = document.querySelectorAll('.banner-video');
    const modal = document.getElementById('videoModal');
    const modalVideo = document.getElementById('modalVideo');
    const closeModal = document.querySelector('.close-modal');

    bannerVideos.forEach(video => {
      video.addEventListener('click', function() {
        modal.style.display = 'flex';
        modalVideo.src = this.src;
        modalVideo.play();
      });
    });

    const sluitVideo = () => {
      modal.style.display = 'none';
      modalVideo.pause();
      modalVideo.src = '';
    };

    closeModal.addEventListener('click', sluitVideo);
    window.addEventListener('click', (event) => {
      if (event.target === modal) {
        sluitVideo();
      }
    });
    </script>
</body>
</html>

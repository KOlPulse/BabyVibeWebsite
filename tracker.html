<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BabyVibe Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <style>
        /* 1. We maken een schone, 100% transparante body voor de tracker */
        body.tracker-body {
            background: transparent !important;
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            color: #fff;
            font-family: sans-serif;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        /* Desktop Layout: Verplaats de box naar rechts */
        .tracker-wrapper {
            justify-content: flex-end !important;
            align-items: flex-start !important;
            padding: 140px 50px 50px 20px !important; 
            display: flex;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .tracker-box {
            padding: 15px 20px !important; 
            width: 100%;
            max-width: 420px !important; 
            background: rgba(10, 10, 15, 0.90);
            backdrop-filter: blur(12px);
            border: 2px solid #00ff88;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.4), inset 0 0 15px rgba(0, 255, 136, 0.1);
            text-align: center;
        }
        
        .tracker-logo {
            width: 70px !important;
            margin-bottom: 5px !important;
            border-radius: 50%;
            box-shadow: 0 0 15px #00ff88;
            border: 2px solid #00ff88;
        }
        
        .neon-input {
            width: 100%;
            padding: 10px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ff88;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
            margin-bottom: 10px;
            text-align: center;
            font-weight: bold;
        }
        
        .neon-input:focus {
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        
        .neon-btn {
            width: 100%;
            padding: 12px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid #00ff88;
            color: #00ff88;
            font-size: 14px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .neon-btn:hover {
            background: #00ff88;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.6);
        }

        /* Mobiele Layout: Forceer de box weer naar het midden */
        @media (max-width: 768px) {
            .tracker-wrapper {
                justify-content: center !important;
                padding: 110px 0 60px 0 !important;
            }
            .tracker-box {
                margin: 0 auto !important;
                width: 85% !important;
            }
        }
    </style>
</head>

<!-- 2. Hier gebruiken we de nieuwe transparante class -->
<body class="tracker-body">

    <!-- Achtergrondvideo -->
    <video autoplay muted loop playsinline class="page-bg-video">
        <source src="appvideo.mp4" type="video/mp4">
    </video>

    <div class="top-buttons-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        <button class="music-btn" onclick="toggleMusic()">🎵 Let's Vibe: <span id="musicState">▶ Play</span></button>
        <audio id="vibeAudio" preload="auto"></audio>
    </div>

    <div class="tracker-wrapper">
        <div class="tracker-box">
            <img src="logo.png" alt="BabyVibe Logo" class="tracker-logo">
            
            <h2 style="margin: 0 0 10px 0; font-size: 22px;">My $BabyVibe Bag</h2>
            
            <div style="display: flex; justify-content: space-between; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 12px; border: 1px solid rgba(0, 255, 136, 0.3); margin-bottom: 15px;">
                <div style="text-align: center; width: 50%; border-right: 1px solid rgba(0, 255, 136, 0.3);">
                    <span style="color: #aaa; font-size: 12px; display: block; margin-bottom: 3px;">Live Price</span>
                    <strong id="livePrice" class="neon-text" style="font-size: 14px;">Loading...</strong>
                </div>
                <div style="text-align: center; width: 50%;">
                    <span style="color: #aaa; font-size: 12px; display: block; margin-bottom: 3px;">Market Cap</span>
                    <strong id="marketCap" class="neon-text" style="font-size: 14px;">Loading...</strong>
                </div>
            </div>

            <div class="input-section">
                <label for="tokenAmount" style="color: #aaa; margin-bottom: 5px; display: block; font-size: 13px;">Enter Your Token Amount:</label>
                <input type="number" id="tokenAmount" class="neon-input" placeholder="0" oninput="calculateTotal()">
                
                <button onclick="calculateTotal()" class="neon-btn">CALCULATE VALUE</button>
            </div>

            <div class="total-value-box" style="background: rgba(0, 255, 136, 0.05); border: 1px solid rgba(0, 255, 136, 0.3); border-radius: 12px; padding: 12px; margin-top: 15px;">
                <h3 style="margin: 0 0 5px 0; color: #ddd; font-size: 14px;">Total Value:</h3>
                <h1 id="totalValue" class="neon-text" style="margin: 0; font-size: 28px;">$0.00</h1>
            </div>

            <button id="installAppBtn" class="neon-btn" style="margin-top: 15px; display: flex;">
                INSTALL AS APP
            </button>
        </div>
    </div>

    <script src="music.js"></script>
    <script>
        const tokenInput = document.getElementById('tokenAmount');
        const priceDisplay = document.getElementById('livePrice');
        const marketCapDisplay = document.getElementById('marketCap');
        const valueDisplay = document.getElementById('totalValue');
        let currentPrice = 0;

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }

        let deferredPrompt;
        const installBtn = document.getElementById('installAppBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
            } else {
                alert("Automatische installatie wordt geblokkeerd door deze browser. Gebruik de 'Deel' of 'Menu' knop van je browser en kies 'Zet op beginscherm' / 'Installeren'!");
            }
        });

        function formatNumber(num) {
            if (num >= 1000000) return '$' + (num / 1000000).toFixed(2) + 'M';
            if (num >= 1000) return '$' + (num / 1000).toFixed(2) + 'K';
            return '$' + num.toFixed(0);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedTokens = localStorage.getItem('babyVibeTokens');
            if (savedTokens) {
                tokenInput.value = savedTokens;
            }
            fetchLivePrice();
            setInterval(fetchLivePrice, 5000);
        });

        async function fetchLivePrice() {
            try {
                const response = await fetch('https://api.dexscreener.com/latest/dex/search?q=An9dC5p9ZqCg9LB4cKCBtLvoJCShpXrWw53xGZwyvroK');
                const data = await response.json();
                
                if (data && data.pairs && data.pairs.length > 0) {
                    const pair = data.pairs[0];
                    currentPrice = parseFloat(pair.priceUsd);
                    priceDisplay.innerText = "$" + currentPrice.toFixed(6);
                    
                    const mc = pair.marketCap || pair.fdv || 0;
                    marketCapDisplay.innerText = mc > 0 ? formatNumber(mc) : "?";
                } else {
                    priceDisplay.innerText = "No pairs found";
                    marketCapDisplay.innerText = "-";
                }
                calculateTotal();
            } catch (error) {
                priceDisplay.innerText = "Retrying...";
            }
        }

        function calculateTotal() {
            const amount = parseFloat(tokenInput.value) || 0;
            localStorage.setItem('babyVibeTokens', amount); 
            const total = amount * currentPrice;
            valueDisplay.innerText = "$" + total.toFixed(2);
        }
    </script>
</body>
</html>
